<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<title>Deck</title>
<style>
  :root { color-scheme:light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overscroll-behavior:none; background:#edf1f5; }
  body { margin:0; overflow:hidden;
         color:#17212c; font:14px -apple-system,Roboto,Segoe UI,sans-serif;
         background-image:radial-gradient(130% 95% at 50% -12%, #fff 0%, #f4f7fa 52%, #e8edf2 100%);
         touch-action:manipulation; user-select:none; -webkit-user-select:none; }

  #stage { position:fixed; left:0; top:0; right:0; bottom:0;
           overflow-y:scroll; overflow-x:hidden;
           scroll-snap-type:y mandatory; overscroll-behavior:contain;
           -webkit-overflow-scrolling:touch; }
  .row { height:100%; display:flex; overflow-x:scroll; overflow-y:hidden;
         scroll-snap-type:x mandatory; scroll-snap-align:start; scroll-snap-stop:always;
         overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .page { flex:none; width:100%; height:100%; padding:5px; contain:layout style;
          scroll-snap-align:start; scroll-snap-stop:always;
          display:flex; flex-wrap:wrap; align-content:center; justify-content:center; }
  /* No Linux esse painel lista todos os apps instalados e passa de uma tela.
     `safe center` centraliza quando cabe e alinha no topo quando nao cabe. */
  #p-recent { align-content:safe center; overflow-y:auto; overscroll-behavior:contain; }
  #stage::-webkit-scrollbar, .row::-webkit-scrollbar,
  #p-recent::-webkit-scrollbar { width:0; height:0; }

  .key { flex:none; margin:5px; border-radius:14px; }

  .key { position:relative; border:0; padding:0; overflow:hidden; color:#17212c; font:inherit;
         display:flex; align-items:center; justify-content:center;
         background-color:#fff;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
                    inset 0 -14px 26px rgba(36,53,69,.055),
                    0 4px 12px rgba(40,55,70,.18);
         transition:transform .1s ease; }
  .key.press { transform:scale(.935); }
  .key.busy { opacity:.52; }
  .key:focus-visible { outline:3px solid #bd6517; outline-offset:3px; }
  .key > * { pointer-events:none; }
  .key .glow { position:absolute; left:0; top:0; right:0; bottom:0; border-radius:14px;
               opacity:0; pointer-events:none; transition:opacity .12s ease; }
  .key.press .glow { opacity:1; }
  .key img, .key .ph { flex:none; display:block; margin-bottom:15px; }
  .key .ph { border-radius:11px; background:#e2e8ee; color:#33485c;
             font-weight:600; display:flex; align-items:center; justify-content:center; }
  .key span { position:absolute; left:0; right:0; bottom:8px; padding:0 8px; text-align:center;
              text-transform:uppercase; letter-spacing:.07em; color:#526170;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #dots { position:fixed; left:0; right:0; bottom:5px; display:flex; justify-content:center;
          opacity:0; pointer-events:none; transition:opacity .35s ease; }
  #dots.on { opacity:1; }
  #dots i { width:5px; height:5px; margin:0 4px; border-radius:50%; background:#a8b3bd; }
  #dots i.on { background:#c96d1d; }

  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); max-width:82%;
           padding:9px 15px; border-radius:13px; font-size:12px; letter-spacing:.02em;
           background:rgba(255,255,255,.97); color:#233140;
           box-shadow:0 8px 26px rgba(40,55,70,.22), inset 0 1px 0 rgba(255,255,255,.9);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
           opacity:0; pointer-events:none; transition:opacity .22s ease; }
  #toast.on { opacity:1; }

  @media (prefers-reduced-motion: reduce) { .key, .key .glow, #dots, #toast { transition:none; } }
</style>
<div id="stage">
  <section class="row"><div class="page" id="p-open"></div></section>
  <section class="row" id="row-fav"><div class="page" id="p-fav0"></div><div class="page" id="p-fav1"></div></section>
  <section class="row"><div class="page" id="p-recent"></div></section>
</div>
<div id="dots"><i class="on"></i><i></i></div>
<div id="toast"></div>
<script>
var data = { favorites: [], running: [], recent: [] };
var grid = { cols: 5, rows: 3, gap: 10, pad: 5, size: 100, w: 0, h: 0 };
var tints = {};
var skins = {};
var stage = document.getElementById('stage');
var rowFav = document.getElementById('row-fav');
var toastEl = document.getElementById('toast');
var dotsEl = document.getElementById('dots');
var dotA = dotsEl.firstElementChild;
var dotB = dotsEl.lastElementChild;
var P = {
  open: document.getElementById('p-open'),
  fav0: document.getElementById('p-fav0'),
  fav1: document.getElementById('p-fav1'),
  recent: document.getElementById('p-recent')
};

// ponytail: molde clonado em vez de montar 3 nos por tecla. cloneNode e bem
// mais barato que createElement + appendChild a cada redesenho.
var MOLD = (function () {
  var b = document.createElement('button');
  b.className = 'key';
  var g = document.createElement('i');
  g.className = 'glow';
  b.appendChild(g);
  b.appendChild(document.createElement('span'));
  return b;
})();

function vibe(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// Chrome Android 135+ deixa um "chin" embaixo quando recolhe a barra de URL.
// Em uma aba comum so o Fullscreen API pode esconder essa interface do browser.
// O pedido precisa nascer de um gesto; aproveita o primeiro toque sem consumir a acao.
function immersive() {
  if (immersive.tried || document.fullscreenElement || !document.fullscreenEnabled) return;
  if (!window.matchMedia('(pointer: coarse)').matches) return;
  if (window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: standalone)').matches) return;
  immersive.tried = true;
  var request = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
  if (request && request.catch) request.catch(function () { });
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.className = 'on';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { toastEl.className = ''; }, 2400);
}

function post(url, body, key) {
  key.classList.add('busy');
  function done() { key.classList.remove('busy'); }
  return fetch(url, { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
    done();
    if (!r.ok) toast(r.statusText || 'o PC recusou');
    return r.ok;
  }, function () { done(); toast('sem conexao com o PC'); });
}

// ponytail: cor dominante = pixel mais saturado de um thumbnail 12x12. Media simples
// vira cinza; quantizacao de verdade nao vale o codigo pra um icone de 32px.
// Um unico canvas serve todas as leituras - criar um por icone so dava trabalho ao GC.
var shot = null, shotCx = null;
function sample(img) {
  try {
    var n = 12;
    if (!shot) {
      shot = document.createElement('canvas');
      shot.width = shot.height = n;
      shotCx = shot.getContext('2d', { willReadFrequently: true });
    }
    shotCx.clearRect(0, 0, n, n);
    shotCx.drawImage(img, 0, 0, n, n);
    var d = shotCx.getImageData(0, 0, n, n).data, best = null, score = 0;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 150) continue;
      var r = d[i], g = d[i + 1], b = d[i + 2];
      var mx = Math.max(r, g, b), s = (mx - Math.min(r, g, b)) * (0.35 + mx / 400);
      if (s > score) { score = s; best = [r, g, b]; }
    }
    if (best && score > 18) return best;
  } catch (e) { }
  return [104, 124, 148];
}

function paint(key, glow, img) {
  var c = [104, 124, 148];
  if (img) c = tints[img.src] || (tints[img.src] = sample(img));
  var skin = skins[c];
  if (!skin) {
    skin = skins[c] = {
      bg: 'linear-gradient(158deg, rgba(' + c + ',.18), rgba(' + c + ',.045) 58%, rgba(255,255,255,.94))',
      ring: 'inset 0 0 0 2px rgba(' + c + ',.78), inset 0 0 22px rgba(' + c + ',.16)'
    };
  }
  key.style.backgroundImage = skin.bg;
  glow.style.boxShadow = skin.ring;
}

// ponytail: um unico jogo de listeners no palco em vez de quatro por tecla.
// touchstart/touchmove sao passivos: o navegador rola o painel sem esperar
// resposta do script. So o touchend precisa barrar o clique sintetico.
var held = null, holdTimer = 0, dead = false, sx = 0, sy = 0;

function letGo() {
  clearTimeout(holdTimer);
  if (held) held.classList.remove('press');
}

stage.addEventListener('touchstart', function (e) {
  var k = e.target.closest ? e.target.closest('.key') : null;
  if (!k) return;
  letGo();
  held = k;
  dead = false;
  k.classList.add('press');
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
  holdTimer = setTimeout(function () {
    dead = true;
    k.classList.remove('press');
    vibe(32);
    hold(k);
  }, 520);
}, { passive: true });

stage.addEventListener('touchmove', function (e) {
  if (!held || dead) return;
  var t = e.touches[0];
  if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) {
    dead = true;
    letGo();
  }
}, { passive: true });

stage.addEventListener('touchend', function (e) {
  if (!held) return;
  var k = held;
  held = null;
  letGo();
  k.classList.remove('press');
  e.preventDefault();
  if (dead) return;
  immersive();
  vibe(12);
  tap(k);
}, { passive: false });

stage.addEventListener('touchcancel', function () {
  dead = true;
  letGo();
  held = null;
}, { passive: true });

stage.addEventListener('click', function (e) {
  if ('ontouchstart' in window) return;
  var k = e.target.closest ? e.target.closest('.key') : null;
  if (!k) return;
  immersive();
  tap(k);
});

function tap(k) {
  if (k.kind === 'open') return post('/api/run', { pid: k.idx }, k);
  if (k.kind === 'recent') return post('/api/run', { recent: k.idx }, k);
  post('/api/run', { fav: k.idx }, k);
}

function hold(k) {
  if (k.kind === 'fav') return post('/api/fav', { remove: k.idx }, k).then(load);
  if (k.kind === 'recent') return post('/api/fav', { add_recent: k.idx }, k).then(load);
  if (k.isFav) return toast(k.label + ' ja esta nos favoritos');
  post('/api/fav', { add: k.idx }, k).then(load);
}

function buildKey(item, size, kind, idx) {
  var b = MOLD.cloneNode(true);
  var glow = b.firstChild;
  var sp = b.lastChild;
  b.style.cssText = 'width:' + size + 'px;height:' + size + 'px';
  var art, as = Math.min(46, Math.round(size * 0.40));
  if (item.icon) {
    art = new Image();
    art.decoding = 'async';
    art.style.cssText = 'width:' + as + 'px;height:' + as + 'px';
    art.onload = function () { paint(b, glow, art); };
    art.src = item.icon;
  } else {
    art = document.createElement('div');
    art.className = 'ph';
    art.textContent = (item.name || '?').charAt(0).toUpperCase();
    art.style.cssText = 'width:' + as + 'px;height:' + as + 'px;font-size:' +
                        Math.round(as * 0.5) + 'px';
    paint(b, glow, null);
  }
  b.insertBefore(art, sp);
  sp.textContent = item.name;
  sp.style.fontSize = Math.max(9, Math.round(size * 0.1)) + 'px';
  b.kind = kind;
  b.idx = idx;
  b.isFav = item.fav;
  b.label = item.name;
  return b;
}

// ponytail: monta fora da arvore e troca de uma vez - o navegador calcula
// layout uma vez por painel em vez de uma vez por tecla.
function fill(page, items, size, kind, from, count) {
  var frag = document.createDocumentFragment();
  var end = Math.min(items.length, from + count);
  for (var i = from; i < end; i++) {
    var a = items[i];
    frag.appendChild(buildKey(a, size, kind, kind === 'open' ? a.pid : i));
  }
  page.textContent = '';
  page.appendChild(frag);
}

// ponytail: escolhe a coluna que deixa a tecla maior, nunca maior que a dos favoritos.
function autoSize(n) {
  var best = 0;
  for (var c = 1; c <= n; c++) {
    var s = Math.min(grid.w / c, grid.h / Math.ceil(n / c)) - grid.gap;
    if (s > best) best = s;
  }
  return Math.max(52, Math.min(grid.size, Math.floor(best)));
}

function render() {
  // Le o tamanho do palco antes de mexer no DOM: evita layout sincrono no meio.
  var pad = 5, gap = 10;
  var w = stage.clientWidth - pad * 2, h = stage.clientHeight - pad * 2;
  var cols = Math.max(3, Math.min(8, Math.round(w / 126)));
  var rows = Math.max(1, Math.floor(h / (w / cols)));
  grid = { cols: cols, rows: rows, gap: gap, pad: pad, w: w, h: h,
           size: Math.max(52, Math.min(140, Math.floor(Math.min(w / cols, h / rows)) - gap)) };

  var per = cols * rows;
  fill(P.fav0, data.favorites, grid.size, 'fav', 0, per);
  fill(P.fav1, data.favorites, grid.size, 'fav', per, per);
  var second = data.favorites.length > per ? '' : 'none';
  if (P.fav1.style.display !== second) P.fav1.style.display = second;

  fill(P.open, data.running, autoSize(data.running.length || 1), 'open', 0, data.running.length);
  fill(P.recent, data.recent, autoSize(data.recent.length || 1), 'recent', 0, data.recent.length);
}

// ponytail: o scroll dispara dezenas de eventos por segundo. Um quadro basta.
var dotsFrame = 0;
function dots() {
  if (!dotsFrame) dotsFrame = requestAnimationFrame(paintDots);
}

function paintDots() {
  dotsFrame = 0;
  if (P.fav1.style.display === 'none') { dotsEl.className = ''; return; }
  var page = rowFav.scrollLeft > rowFav.clientWidth / 2 ? 1 : 0;
  dotA.className = page ? '' : 'on';
  dotB.className = page ? 'on' : '';
  dotsEl.className = Math.abs(stage.scrollTop - stage.clientHeight) < 4 ? 'on' : '';
  clearTimeout(paintDots.timer);
  paintDots.timer = setTimeout(function () { dotsEl.className = ''; }, 1400);
}

function load() {
  return fetch('/api/apps').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    render();
  }, function () { toast('sem conexao com o PC'); });
}

stage.addEventListener('scroll', dots, { passive: true });
rowFav.addEventListener('scroll', dots, { passive: true });
// ponytail: a barra de URL do Chrome some e volta durante o scroll e dispara resize.
// Redesenhar no meio do fling deixa painel cortado - espera parar e recoloca no lugar.
function reflow() {
  clearTimeout(reflow.timer);
  reflow.timer = setTimeout(function () {
    var v = Math.round(stage.scrollTop / stage.clientHeight);
    var p = Math.round(rowFav.scrollLeft / rowFav.clientWidth);
    render();
    stage.scrollTop = v * stage.clientHeight;
    rowFav.scrollLeft = p * rowFav.clientWidth;
  }, 220);
}

window.addEventListener('resize', reflow);
window.addEventListener('orientationchange', reflow);
// ponytail: sem polling, poupa bateria. Recarrega ao voltar pra tela.
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

load().then(function () { stage.scrollTop = stage.clientHeight; });
</script>
