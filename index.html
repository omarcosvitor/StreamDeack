<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<title>Deck</title>
<style>
  :root { color-scheme:light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overscroll-behavior:none; background:#edf1f5; }
  body { margin:0; overflow:hidden;
         color:#17212c; font:14px -apple-system,Roboto,Segoe UI,sans-serif;
         background-image:radial-gradient(130% 95% at 50% -12%, #fff 0%, #f4f7fa 52%, #e8edf2 100%);
         touch-action:manipulation; user-select:none; -webkit-user-select:none; }

  #stage { position:fixed; left:0; top:0; right:0; bottom:0;
           overflow-y:scroll; overflow-x:hidden;
           scroll-snap-type:y mandatory; overscroll-behavior:contain;
           -webkit-overflow-scrolling:touch; }
  .row { height:100%; display:flex; overflow-x:scroll; overflow-y:hidden;
         scroll-snap-type:x mandatory; scroll-snap-align:start; scroll-snap-stop:always;
         overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .page { flex:none; width:100%; height:100%; padding:5px;
          scroll-snap-align:start; scroll-snap-stop:always;
          display:flex; flex-wrap:wrap; align-content:center; justify-content:center; }
  #stage::-webkit-scrollbar, .row::-webkit-scrollbar { width:0; height:0; }

  .key { flex:none; margin:5px; border-radius:14px; }

  .key { position:relative; border:0; padding:0; overflow:hidden; color:#17212c; font:inherit;
         display:flex; align-items:center; justify-content:center;
         background-color:#fff;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
                    inset 0 -14px 26px rgba(36,53,69,.055),
                    0 4px 12px rgba(40,55,70,.18);
         transition:transform .1s ease; }
  .key.press { transform:scale(.935); }
  .key.busy { opacity:.52; }
  .key:focus-visible { outline:3px solid #bd6517; outline-offset:3px; }
  .key .glow { position:absolute; left:0; top:0; right:0; bottom:0; border-radius:14px;
               opacity:0; pointer-events:none; transition:opacity .12s ease; }
  .key.press .glow { opacity:1; }
  .key img, .key .ph { flex:none; display:block; margin-bottom:15px; }
  .key .ph { border-radius:11px; background:#e2e8ee; color:#33485c;
             font-weight:600; display:flex; align-items:center; justify-content:center; }
  .key span { position:absolute; left:0; right:0; bottom:8px; padding:0 8px; text-align:center;
              text-transform:uppercase; letter-spacing:.07em; color:#526170;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #dots { position:fixed; left:0; right:0; bottom:5px; display:flex; justify-content:center;
          opacity:0; pointer-events:none; transition:opacity .35s ease; }
  #dots.on { opacity:1; }
  #dots i { width:5px; height:5px; margin:0 4px; border-radius:50%; background:#a8b3bd; }
  #dots i.on { background:#c96d1d; }

  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); max-width:82%;
           padding:9px 15px; border-radius:13px; font-size:12px; letter-spacing:.02em;
           background:rgba(255,255,255,.97); color:#233140;
           box-shadow:0 8px 26px rgba(40,55,70,.22), inset 0 1px 0 rgba(255,255,255,.9);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
           opacity:0; pointer-events:none; transition:opacity .22s ease; }
  #toast.on { opacity:1; }

  @media (prefers-reduced-motion: reduce) { .key, .key .glow, #dots, #toast { transition:none; } }
</style>
<div id="stage">
  <section class="row"><div class="page" id="p-open"></div></section>
  <section class="row" id="row-fav"><div class="page" id="p-fav0"></div><div class="page" id="p-fav1"></div></section>
  <section class="row"><div class="page" id="p-recent"></div></section>
</div>
<div id="dots"><i class="on"></i><i></i></div>
<div id="toast"></div>
<script>
var data = { favorites: [], running: [], recent: [] };
var grid = { cols: 5, rows: 3, gap: 10, size: 100 };
var tints = {};
var stage = document.getElementById('stage');
var rowFav = document.getElementById('row-fav');
var P = {
  open: document.getElementById('p-open'),
  fav0: document.getElementById('p-fav0'),
  fav1: document.getElementById('p-fav1'),
  recent: document.getElementById('p-recent')
};

function vibe(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// Chrome Android 135+ deixa um "chin" embaixo quando recolhe a barra de URL.
// Em uma aba comum so o Fullscreen API pode esconder essa interface do browser.
// O pedido precisa nascer de um gesto; aproveita o primeiro toque sem consumir a acao.
function immersive() {
  if (immersive.tried || document.fullscreenElement || !document.fullscreenEnabled) return;
  if (!window.matchMedia('(pointer: coarse)').matches) return;
  if (window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: standalone)').matches) return;
  immersive.tried = true;
  var request = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
  if (request && request.catch) request.catch(function () { });
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.className = ''; }, 2400);
}

function post(url, body, key) {
  key.className += ' busy';
  function done() { key.className = key.className.replace(' busy', ''); }
  return fetch(url, { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
    done();
    if (!r.ok) toast(r.statusText || 'o PC recusou');
    return r.ok;
  }, function () { done(); toast('sem conexao com o PC'); });
}

// ponytail: cor dominante = pixel mais saturado de um thumbnail 12x12. Media simples
// vira cinza; quantizacao de verdade nao vale o codigo pra um icone de 32px.
function sample(img) {
  try {
    var n = 12, cv = document.createElement('canvas');
    cv.width = cv.height = n;
    var cx = cv.getContext('2d');
    cx.drawImage(img, 0, 0, n, n);
    var d = cx.getImageData(0, 0, n, n).data, best = null, score = 0;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 150) continue;
      var r = d[i], g = d[i + 1], b = d[i + 2];
      var mx = Math.max(r, g, b), s = (mx - Math.min(r, g, b)) * (0.35 + mx / 400);
      if (s > score) { score = s; best = [r, g, b]; }
    }
    if (best && score > 18) return best;
  } catch (e) { }
  return [104, 124, 148];
}

function paint(key, glow, img) {
  var c = [104, 124, 148];
  if (img) {
    if (!tints[img.src]) tints[img.src] = sample(img);
    c = tints[img.src];
  }
  key.style.backgroundImage = 'linear-gradient(158deg, rgba(' + c + ',.18), rgba(' + c + ',.045) 58%, rgba(255,255,255,.94))';
  glow.style.boxShadow = 'inset 0 0 0 2px rgba(' + c + ',.78), inset 0 0 22px rgba(' + c + ',.16)';
}

function press(el, tap, hold) {
  var timer, dead, sx, sy;
  function on() { el.className += ' press'; }
  function off() { el.className = el.className.replace(' press', ''); }
  el.addEventListener('touchstart', function (e) {
    dead = false;
    on();
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    timer = setTimeout(function () { dead = true; off(); vibe(32); hold(el); }, 520);
  });
  el.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) {
      clearTimeout(timer);
      dead = true;
      off();
    }
  });
  el.addEventListener('touchend', function (e) {
    clearTimeout(timer);
    off();
    e.preventDefault();
    if (dead) return;
    immersive();
    vibe(12);
    tap(el);
  });
  el.onclick = function () {
    if (!('ontouchstart' in window)) { immersive(); tap(el); }
  };
}

function buildKey(item, size, tap, hold) {
  var b = document.createElement('button');
  b.className = 'key';
  b.style.width = b.style.height = size + 'px';
  var glow = document.createElement('i');
  glow.className = 'glow';
  b.appendChild(glow);
  var art, as = Math.min(46, Math.round(size * 0.40));
  if (item.icon) {
    art = document.createElement('img');
    art.onload = function () { paint(b, glow, art); };
    art.src = item.icon;
  } else {
    art = document.createElement('div');
    art.className = 'ph';
    art.textContent = (item.name || '?').charAt(0).toUpperCase();
    art.style.fontSize = Math.round(as * 0.5) + 'px';
    paint(b, glow, null);
  }
  art.style.width = art.style.height = as + 'px';
  b.appendChild(art);
  var sp = document.createElement('span');
  sp.textContent = item.name;
  sp.style.fontSize = Math.max(9, Math.round(size * 0.1)) + 'px';
  b.appendChild(sp);
  press(b, tap, hold);
  return b;
}

function layout() {
  var pad = 5, gap = 10;
  var iw = stage.clientWidth - pad * 2, ih = stage.clientHeight - pad * 2;
  var cols = Math.max(3, Math.min(8, Math.round(iw / 126)));
  var rows = Math.max(1, Math.floor(ih / (iw / cols)));
  grid = { cols: cols, rows: rows, gap: gap, pad: pad,
           size: Math.max(52, Math.min(140, Math.floor(Math.min(iw / cols, ih / rows)) - gap)) };
}

// ponytail: escolhe a coluna que deixa a tecla maior, nunca maior que a dos favoritos.
function autoSize(n) {
  var iw = stage.clientWidth - grid.pad * 2, ih = stage.clientHeight - grid.pad * 2, best = 0;
  for (var c = 1; c <= n; c++) {
    var s = Math.min(iw / c, ih / Math.ceil(n / c)) - grid.gap;
    if (s > best) best = s;
  }
  return Math.max(52, Math.min(grid.size, Math.floor(best)));
}

function favPage(page, from) {
  page.innerHTML = '';
  var end = Math.min(data.favorites.length, from + grid.cols * grid.rows);
  for (var i = from; i < end; i++) page.appendChild(favKey(data.favorites[i], i));
}

function favKey(a, idx) {
  return buildKey(a, grid.size,
    function (b) { post('/api/run', { fav: idx }, b); },
    function (b) { post('/api/fav', { remove: idx }, b).then(load); });
}

function openKey(a, size) {
  return buildKey(a, size,
    function (b) { post('/api/run', { pid: a.pid }, b); },
    function (b) {
      if (a.fav) return toast(a.name + ' ja esta nos favoritos');
      post('/api/fav', { add: a.pid }, b).then(load);
    });
}

function recentKey(a, idx, size) {
  return buildKey(a, size,
    function (b) { post('/api/run', { recent: idx }, b); },
    function (b) { post('/api/fav', { add_recent: idx }, b).then(load); });
}

function render() {
  layout();
  var per = grid.cols * grid.rows;
  favPage(P.fav0, 0);
  favPage(P.fav1, per);
  P.fav1.style.display = data.favorites.length > per ? '' : 'none';

  P.open.innerHTML = '';
  var size = autoSize(data.running.length || 1);
  data.running.forEach(function (a) { P.open.appendChild(openKey(a, size)); });

  P.recent.innerHTML = '';
  size = autoSize(data.recent.length || 1);
  data.recent.forEach(function (a, i) { P.recent.appendChild(recentKey(a, i, size)); });
}

function dots() {
  var d = document.getElementById('dots');
  if (P.fav1.style.display === 'none') { d.className = ''; return; }
  var page = rowFav.scrollLeft > rowFav.clientWidth / 2 ? 1 : 0;
  d.childNodes[0].className = page ? '' : 'on';
  d.childNodes[1].className = page ? 'on' : '';
  d.className = Math.abs(stage.scrollTop - stage.clientHeight) < 4 ? 'on' : '';
  clearTimeout(dots.timer);
  dots.timer = setTimeout(function () { d.className = ''; }, 1400);
}

function load() {
  return fetch('/api/apps').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    render();
  }, function () { toast('sem conexao com o PC'); });
}

stage.addEventListener('scroll', dots);
rowFav.addEventListener('scroll', dots);
// ponytail: a barra de URL do Chrome some e volta durante o scroll e dispara resize.
// Redesenhar no meio do fling deixa painel cortado - espera parar e recoloca no lugar.
function reflow() {
  clearTimeout(reflow.timer);
  reflow.timer = setTimeout(function () {
    var v = Math.round(stage.scrollTop / stage.clientHeight);
    var p = Math.round(rowFav.scrollLeft / rowFav.clientWidth);
    render();
    stage.scrollTop = v * stage.clientHeight;
    rowFav.scrollLeft = p * rowFav.clientWidth;
  }, 220);
}

window.addEventListener('resize', reflow);
window.addEventListener('orientationchange', reflow);
// ponytail: sem polling, poupa bateria. Recarrega ao voltar pra tela.
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

load().then(function () { stage.scrollTop = stage.clientHeight; });
</script>
