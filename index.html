<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<title>Deck</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior: none; }
  body { margin:0; padding:10px 4px 24px; background:#111; color:#eee;
         font:14px -apple-system,Roboto,Segoe UI,sans-serif;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
       color:#777; margin:16px 0 4px 8px; }
  #bar { display:flex; align-items:center; padding:0 6px; }
  #bar b { font-size:15px; letter-spacing:.06em; }
  #bar button { margin-left:8px; background:#222; color:#999; border:0;
                border-radius:10px; padding:10px 18px; font-size:16px; }
  #bar button:first-of-type { margin-left:auto; }
  #bar button.on { background:#c9762b; color:#111; }
  .grid { display:flex; flex-wrap:wrap; }
  .tile { position:relative; width:94px; height:94px; margin:4px; padding:6px;
          border:0; border-radius:14px; background:#222; color:#eee; font:inherit;
          overflow:hidden; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }
  .tile:active { background:#3c3c3c; }
  .tile img { width:40px; height:40px; }
  .tile .ph { width:40px; height:40px; border-radius:10px; background:#33475c;
              font-size:20px; line-height:40px; text-align:center; }
  .tile span { margin-top:7px; font-size:11px; width:100%; text-align:center;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .badge { position:absolute; top:1px; right:6px; font-size:15px; color:#c9762b; }
  .tile.dim { opacity:.35; }
</style>
<div id="bar">
  <b>DECK</b>
  <button id="editbtn" onclick="toggleEdit()">&#9998;</button>
  <button onclick="load()">&#8635;</button>
</div>
<h2>Favoritos</h2><div class="grid" id="fav"></div>
<h2>Abertos no PC</h2><div class="grid" id="run"></div>
<script>
var edit = false;
var data = { favorites: [], running: [] };

function post(url, body, tile) {
  if (tile) tile.className += ' dim';
  return fetch(url, { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
    if (tile) tile.className = tile.className.replace(' dim', '');
    if (!r.ok) alert(r.statusText);
    return r.ok;
  });
}

function tile(label, icon, badge, onTap) {
  var b = document.createElement('button');
  b.className = 'tile';
  var art;
  if (icon) { art = document.createElement('img'); art.src = icon; }
  else {
    art = document.createElement('div');
    art.className = 'ph';
    art.textContent = (label || '?').charAt(0).toUpperCase();
  }
  var sp = document.createElement('span');
  sp.textContent = label;
  b.appendChild(art);
  b.appendChild(sp);
  if (badge) {
    var bd = document.createElement('div');
    bd.className = 'badge';
    bd.textContent = badge;
    b.appendChild(bd);
  }
  b.onclick = function () { onTap(b); };
  return b;
}

function render() {
  var fav = document.getElementById('fav');
  var run = document.getElementById('run');
  fav.innerHTML = '';
  run.innerHTML = '';

  data.favorites.forEach(function (a, i) {
    fav.appendChild(tile(a.name, a.icon, edit ? '✕' : '', function (b) {
      if (!edit) return post('/api/run', { fav: i }, b);
      post('/api/fav', { remove: i }, b).then(load);
    }));
  });

  data.running.forEach(function (a) {
    var badge = edit ? (a.fav ? '★' : '☆') : '';
    run.appendChild(tile(a.name, a.icon, badge, function (b) {
      if (!edit) return post('/api/run', { pid: a.pid }, b);
      if (a.fav) return;
      post('/api/fav', { add: a.pid }, b).then(load);
    }));
  });
}

function toggleEdit() {
  edit = !edit;
  document.getElementById('editbtn').className = edit ? 'on' : '';
  render();
}

function load() {
  return fetch('/api/apps').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    render();
  });
}

load();
// ponytail: sem polling, poupa bateria. Recarrega ao voltar pra tela.
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
</script>
