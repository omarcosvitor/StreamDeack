name: Instalador

# Gera o instalador do Windows a cada push na main. O .exe fica anexado a
# execucao, em Actions -> a execucao -> Artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do instalador (x.y.z)"
        required: false
        default: "1.1.0"

permissions:
  contents: read

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || '1.1.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      # O build.ps1 procura o ISCC em varios lugares; os runners costumam ja
      # trazer o Inno Setup, entao so instala quando faltar.
      - name: Garantir o Inno Setup
        run: |
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($iscc) {
            Write-Host "Inno Setup encontrado em $iscc"
          } else {
            Write-Host 'Inno Setup ausente, instalando'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel instalar o Inno Setup ($LASTEXITCODE)." }
          }

      - name: Gerar o instalador
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\build.ps1 -Version $env:VERSION

      - name: Conferir o resultado
        run: |
          $exe = Get-Item "release\StreamDeck-Setup-$env:VERSION.exe" -ErrorAction Stop
          Write-Host ("{0} - {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 1MB) { throw 'Instalador menor que o esperado.' }

      # O instalador tem ~12 MB por execucao. Guardar 90 dias estoura a cota de
      # armazenamento da conta; duas semanas cobrem de sobra o uso real.
      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Setup-${{ env.VERSION }}
          path: release/StreamDeck-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
          # O .exe ja sai comprimido em lzma2 pelo Inno Setup; zipar de novo
          # so gastaria CPU sem reduzir o que ocupa na cota.
          compression-level: 0
