name: Release

# Cada push na main publica uma release nova, com o instalador do Windows e o
# pacote do Linux. A versao incrementa o patch da ultima release publicada, de
# modo que o historico fica na lista de releases:
# https://github.com/omarcosvitor/StreamDeack/releases
#
# Os jobs sobem os arquivos direto numa release em rascunho em vez de passar por
# artefatos entre jobs: a cota de artefatos do Actions nao aguenta um instalador
# de ~12 MB por push e, quando estoura, o workflow inteiro cai. Entre os jobs so
# viaja o sha256, que e texto. Se um dos builds falhar, a release fica em
# rascunho e ninguem baixa um par de arquivos pela metade.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (x.y.z). Vazio incrementa o patch da ultima release."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        env:
          ENTRADA: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$ENTRADA" ]; then
            echo "$ENTRADA" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "Versao invalida: $ENTRADA" >&2; exit 1; }
            version="$ENTRADA"
          else
            anterior=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [ -z "$anterior" ]; then
              # Primeira release versionada: parte do default do build.ps1, que
              # continua sendo a versao usada em quem gera o instalador na mao.
              version=$(sed -n 's/.*Version = .\([0-9][0-9.]*\).*/\1/p' build.ps1 | head -n 1)
              [ -n "$version" ] || { echo "Nao achei a versao no build.ps1" >&2; exit 1; }
            else
              IFS=. read -r maior menor patch <<< "${anterior#v}"
              version="$maior.$menor.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versao desta release: $version"

      - name: Abrir a release em rascunho
        env:
          VERSION: ${{ steps.calc.outputs.version }}
        run: |
          set -euo pipefail
          # Um rascunho nao cria a tag, entao uma tentativa anterior que falhou
          # deixa a mesma versao pendente: reaproveita o rascunho em vez de parar.
          # Se a release ja estiver publicada, o create falha de proposito.
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            echo "Reaproveitando o rascunho de v$VERSION"
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
              --title "StreamDeck $VERSION" --notes "Build em andamento."
          fi

  windows:
    needs: versao
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.pacote.outputs.sha }}
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      # O build.ps1 procura o ISCC em varios lugares; os runners costumam ja
      # trazer o Inno Setup, entao so instala quando faltar.
      - name: Garantir o Inno Setup
        run: |
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($iscc) {
            Write-Host "Inno Setup encontrado em $iscc"
          } else {
            Write-Host 'Inno Setup ausente, instalando'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel instalar o Inno Setup ($LASTEXITCODE)." }
          }

      - name: Gerar o instalador
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\build.ps1 -Version $env:VERSION

      - name: Conferir e enviar o instalador
        id: pacote
        run: |
          $exe = Get-Item "release\StreamDeck-Setup-$env:VERSION.exe" -ErrorAction Stop
          Write-Host ("{0} - {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 1MB) { throw 'Instalador menor que o esperado.' }

          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          gh release upload "v$env:VERSION" $exe.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel enviar o instalador ($LASTEXITCODE)." }

  linux:
    needs: versao
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pacote.outputs.sha }}
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # Pacote de codigo, nao binario: o decklinux usa o python3-gobject da
      # distro (que o README ja exige) e o KWin. Empacotar o GLib do runner
      # Ubuntu quebraria justamente no Fedora/KDE, que e o alvo do backend.
      - name: Montar o pacote
        run: |
          set -euo pipefail
          pasta="StreamDeck-$VERSION"
          mkdir -p "$pasta"
          cp deck.py decklinux.py deckupdate.py index.html install.sh README.md "$pasta/"
          chmod +x "$pasta/install.sh"
          # O deck instalado compara este numero com a ultima release pra saber
          # se ha atualizacao. So existe no pacote publicado.
          printf '%s' "$VERSION" > "$pasta/version.txt"
          tar --create --gzip --file "StreamDeck-$VERSION-linux.tar.gz" "$pasta"

      - name: Conferir e enviar o pacote
        id: pacote
        run: |
          set -euo pipefail
          python3 -m compileall -q deck.py decklinux.py deckupdate.py
          sh -n install.sh
          tar --list --file "StreamDeck-$VERSION-linux.tar.gz"

          sha=$(sha256sum "StreamDeck-$VERSION-linux.tar.gz" | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          gh release upload "v$VERSION" "StreamDeck-$VERSION-linux.tar.gz" --clobber

  publicar:
    needs: [versao, windows, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      SHA_WINDOWS: ${{ needs.windows.outputs.sha }}
      SHA_LINUX: ${{ needs.linux.outputs.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As notas saem dos commits desde a release anterior, e o sha256 permite
      # conferir o download antes de executar. A tag desta release ja existe (o
      # rascunho criou), entao ela sai da lista antes de escolher a anterior.
      - name: Montar as notas
        run: |
          set -euo pipefail
          anterior=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "v$VERSION" | head -n 1 || true)
          if [ -n "$anterior" ]; then
            faixa="desde a $anterior"
            mudancas=$(git log --no-merges --pretty='- %s' "$anterior..HEAD")
          else
            faixa="primeira release versionada"
            mudancas=$(git log --no-merges --pretty='- %s' -n 20)
          fi
          [ -n "$mudancas" ] || mudancas="- nenhuma mudanca de codigo $faixa"
          {
            echo "## O que mudou ($faixa)"
            echo
            echo "$mudancas"
            echo
            echo "## Instalar"
            echo
            echo "**Windows:** baixe o \`StreamDeck-Setup-$VERSION.exe\` e execute."
            echo "Nao precisa de Python nem de permissao de administrador. Os favoritos"
            echo "ficam em \`%LOCALAPPDATA%\StreamDeck\apps.json\` e sobrevivem a atualizacao."
            echo
            echo "**Linux (KDE Plasma 6):** baixe o \`StreamDeck-$VERSION-linux.tar.gz\`."
            echo
            echo '```bash'
            echo "tar --extract --gzip --file StreamDeck-$VERSION-linux.tar.gz"
            echo "cd StreamDeck-$VERSION && ./install.sh"
            echo '```'
            echo
            echo "Sobe como servico de usuario do systemd. Para remover: \`./install.sh --uninstall\`."
            echo
            echo "## SHA256"
            echo
            echo '```'
            echo "$SHA_WINDOWS  StreamDeck-Setup-$VERSION.exe"
            echo "$SHA_LINUX  StreamDeck-$VERSION-linux.tar.gz"
            echo '```'
          } > notas.md
          cat notas.md

      - name: Publicar a release
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --notes-file notas.md --draft=false --latest
          echo "Publicado em https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
