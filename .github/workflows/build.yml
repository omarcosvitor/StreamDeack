name: Instalador

# Gera o instalador do Windows a cada push na main e publica na release
# "latest", que sempre aponta pro ultimo commit:
# https://github.com/omarcosvitor/StreamDeack/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do instalador (x.y.z)"
        required: false
        default: "1.1.0"

permissions:
  contents: write

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || '1.1.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      # O build.ps1 procura o ISCC em varios lugares; os runners costumam ja
      # trazer o Inno Setup, entao so instala quando faltar.
      - name: Garantir o Inno Setup
        run: |
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($iscc) {
            Write-Host "Inno Setup encontrado em $iscc"
          } else {
            Write-Host 'Inno Setup ausente, instalando'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel instalar o Inno Setup ($LASTEXITCODE)." }
          }

      - name: Gerar o instalador
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\build.ps1 -Version $env:VERSION

      - name: Conferir o resultado
        run: |
          $exe = Get-Item "release\StreamDeck-Setup-$env:VERSION.exe" -ErrorAction Stop
          Write-Host ("{0} - {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 1MB) { throw 'Instalador menor que o esperado.' }

      # Publica como release em vez de artefato: o .exe ganha link fixo e nao
      # consome a cota de armazenamento de artefatos do Actions, pequena demais
      # pra um instalador de ~12 MB por push.
      - name: Publicar o instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "release\StreamDeck-Setup-$env:VERSION.exe"
          $notas = @(
            "Instalador gerado a partir do commit $($env:GITHUB_SHA.Substring(0, 7)) na main.",
            "",
            "Baixe o **StreamDeck-Setup-$env:VERSION.exe** aqui embaixo e execute.",
            "Nao precisa de Python nem de permissao de administrador.",
            "",
            "Os favoritos ficam em %LOCALAPPDATA%\StreamDeck\apps.json e sobrevivem a atualizacao."
          ) -join "`n"

          # Release rolante: apaga a anterior pra tag apontar pro commit novo.
          # Na primeira execucao ainda nao existe nada, e falhar aqui e esperado.
          gh release delete latest --yes --cleanup-tag

          gh release create latest $exe --target $env:GITHUB_SHA --title "StreamDeck $env:VERSION" --notes $notas
          if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel publicar a release (codigo $LASTEXITCODE)." }

          Write-Host "Publicado em https://github.com/$env:GITHUB_REPOSITORY/releases/latest"
